  text-align: center;
  position: relative;
}
.header::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: radial-gradient(circle, rgba(255,255,255,0.08) 1px, transparent 1px);
  background-size: 24px 24px;
  animation: float 20s linear infinite;
  pointer-events: none;

@keyframes float { to { transform: translateY(-24px); } }
.header h1 { font-size: 26px; font-weight: 700; position: relative; z-index: 1; }

/* ── 副标题行：分类文字 + 刷新按钮（与内页一致） ── */
.subtitle-row {

  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-top: 10px;
  position: relative;
  z-index: 1;
}
.subtitle-row p {
  font-size: 14px;
  opacity: 0.85;
}

/* ── 圆形功能按钮（与内页 .header-btn 样式一致） ── */

  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  color: rgba(255,255,255,0.9);
  text-decoration: none;
  background: rgba(255,255,255,0.15);
  border-radius: 50%;
  backdrop-filter: blur(10px);
  cursor: pointer;
  transition: background 0.2s, transform 0.2s;
  border: none;
  -webkit-tap-highlight-color: transparent;
  flex-shrink: 0;
}
.header-btn svg {
  width: 18px;
  height: 18px;
  stroke: currentColor;
  fill: none;
}
.header-btn:hover {
  background: rgba(255,255,255,0.28);
  transform: scale(1.1);
}
.header-btn:active {
  transform: scale(0.9);
}

.container { max-width: 600px; margin: 0 auto; padding: 20px 16px; }

/* ── 月份分组 ── */
.month-group { margin-bottom: 24px; }
.month-hidden { display: none; }
.month-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 4px 8px;
  cursor: default;
}
.month-header .month-label {
  font-size: 18px;
  font-weight: 700;
  color: #1d1d1f;
}

  font-size: 12px;
  color: #8e8e93;
  background: #f0f2f5;
  padding: 2px 10px;
  border-radius: 10px;
}

/* ── 卡片 ── */

  border-radius: 16px;
  padding: 24px;
  margin-bottom: 16px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  transition: transform 0.2s, box-shadow 0.2s;
  display: flex;
  align-items: center;
  gap: 16px;
  text-decoration: none;
  color: inherit;
}
.card:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
.card .date-icon {
  width: 52px; height: 52px;
  border-radius: 14px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; text-align: center;
  flex-shrink: 0;
  line-height: 1.3;

.card .info { flex: 1; }
.card .info .title { font-size: 16px; font-weight: 600; color: #1d1d1f; }
.card .info .meta { font-size: 12px; color: #8e8e93; margin-top: 4px; }
.card .arrow { color: #c7c7cc; font-size: 18px; }
.latest-badge {
  display: inline-block;
  background: #ff3b30;
  color: white;
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 10px;
  margin-left: 8px;
  font-weight: 600;
}

/* ── 加载更多 / 展开月份 ── */

  display: block;
  width: 100%;
  padding: 14px;
  margin-top: 4px;
  margin-bottom: 8px;
  background: white;
  border: 1.5px dashed #d1d1d6;
  border-radius: 14px;

  font-size: 14px;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;

.load-more-btn:hover { background: #f5f5f7; border-color: #667eea; }
.load-more-btn:active { transform: scale(0.98); }

.month-toggle-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 100%;
  padding: 12px;
  margin-bottom: 12px;

  color: #667eea;

.month-toggle-btn:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
.month-toggle-btn:active { transform: scale(0.98); }
.month-toggle-btn svg {

  vertical-align: middle;
  margin-right: 4px;
  transition: transform 0.3s;
  flex-shrink: 0;

/* 收起状态样式（更轻量） */

  background: transparent;
  border: 1px solid #d1d1d6;
  box-shadow: none;
  color: #8e8e93;
  font-size: 13px;
  padding: 10px;

/* ── 隐藏卡片（懒加载） ── */
.card-hidden { display: none; }
.cards-hidden { display: none; }

/* ── 回到顶部（与内页一致） ── */

  right: 24px;

  height: 44px;

.back-to-top.show {

const MONTH_NAMES = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const VISIBLE_COUNT = 7;   // 每组初始显示卡片数量
const VISIBLE_MONTHS = 7;  // 初始显示月份数量

// 获取当前年月（用于自动展开本月）
const _now = new Date();
const CURRENT_YEAR = _now.getFullYear();
const CURRENT_MONTH = _now.getMonth() + 1;

// ── 回到顶部按钮逻辑 ──
(function() {
  var btn = document.getElementById('backToTop');
  window.addEventListener('scroll', function() {
    if (window.scrollY > 300) {
      btn.classList.add('show');
    } else {
      btn.classList.remove('show');
    }
  }, { passive: true });
  btn.addEventListener('click', function() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
})();

// 按月份分组
function groupByMonth(cards) {
  const groups = {};
  cards.forEach(card => {
    const y = card.date.slice(0, 4);
    const m = parseInt(card.date.slice(5, 7));
    const key = `${y}-${m}`;
    if (!groups[key]) groups[key] = { year: y, month: m, cards: [] };
    groups[key].cards.push(card);
  });
  // 按年月降序排列
  return Object.values(groups).sort((a, b) => {
    if (a.year !== b.year) return b.year - a.year;
    return b.month - a.month;
  });
}

function renderCard(card) {
  const m = parseInt(card.date.slice(5, 7));
  const d = parseInt(card.date.slice(8, 10));
  const dateDisplay = card.date.replace(/-/g, '.');
  const badge = card.isLatest ? ' <span class="latest-badge">最新</span>' : '';
  return `<a class="card" href="daily/${card.date}.html" target="_self">
    <div class="date-icon">${m}月<br>${d}日</div>
    <div class="info">
      <div class="title">${dateDisplay} 限免速报${badge}</div>
      <div class="meta">${card.stats}</div>
    </div>
    <div class="arrow">›</div>
  </a>`;
}

function render() {
  const container = document.getElementById('app');
  const groups = groupByMonth(CARDS_DATA);

  let html = '';
  groups.forEach((group, gi) => {
    const key = `${group.year}-${group.month}`;
    const total = group.cards.length;
    const label = `${group.year}年${MONTH_NAMES[group.month - 1]}`;

    // 判断是否为当前月份 → 自动展开
    const isCurrentMonth = (parseInt(group.year) === CURRENT_YEAR && group.month === CURRENT_MONTH);
    // 判断是否超出初始显示月份数 → 月份懒加载隐藏
    const isMonthHidden = gi >= VISIBLE_MONTHS;

    html += `<div class="month-group${isMonthHidden ? ' month-hidden' : ''}" data-month="${key}">`;
    html += `<div class="month-header">`;
    html += `<span class="month-label">${label}</span>`;
    html += `<span class="month-count">${total} 篇</span>`;
    html += `</div>`;

    // ── 展开/收起按钮始终在上方（month-header 下方、卡片上方） ──
    if (isCurrentMonth) {
      // 当前月份：默认展开，上方显示"收起"按钮
      html += `<div class="month-toggle-wrap">`;
      html += `<button class="month-toggle-btn expanded" data-month="${key}" data-action="collapse" onclick="toggleMonth(this, '${key}')">`;
      html += `<svg class="panel-top-close" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18,15 12,9 6,15"/></svg> 收起${label}限免`;
      html += `</button>`;
      html += `</div>`;
      // 卡片区域：直接展开
      html += `<div class="month-detail" data-month="${key}">`;
      group.cards.forEach((card, ci) => {
        const hidden = ci >= VISIBLE_COUNT ? ' card-hidden' : '';
        html += `<div class="card-item${hidden}" data-idx="${ci}">${renderCard(card)}</div>`;
      });
      if (total > VISIBLE_COUNT) {
        html += `<button class="load-more-btn" data-month="${key}" data-loaded="${VISIBLE_COUNT}" data-total="${total}" onclick="loadMore(this)">加载更多（还有 ${total - VISIBLE_COUNT} 篇）</button>`;
      }
      html += `</div>`;
    } else {
      // 往期月份：默认收起，上方显示"展开"按钮
      html += `<div class="month-toggle-wrap">`;
      html += `<button class="month-toggle-btn collapsed-style" data-month="${key}" data-action="expand" onclick="toggleMonth(this, '${key}')">`;
      html += `<svg class="panel-top-open" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6,9 12,15 18,9"/></svg> 查看${label}全部限免（${total} 篇）`;
      html += `</button>`;
      html += `</div>`;
      // 卡片区域：默认隐藏
      html += `<div class="month-detail cards-hidden" data-month="${key}">`;
      group.cards.forEach((card, ci) => {
        const hidden = ci >= VISIBLE_COUNT ? ' card-hidden' : '';
        html += `<div class="card-item${hidden}" data-idx="${ci}">${renderCard(card)}</div>`;
      });
      if (total > VISIBLE_COUNT) {
        html += `<button class="load-more-btn" data-month="${key}" data-loaded="${VISIBLE_COUNT}" data-total="${total}" onclick="loadMore(this)">加载更多（还有 ${total - VISIBLE_COUNT} 篇）</button>`;
      }
      html += `</div>`;
    }

    html += `</div>`;
  });

  // 月份懒加载按钮：如果月份总数超过 VISIBLE_MONTHS，显示"加载更多月份"
  if (groups.length > VISIBLE_MONTHS) {
    const remainingMonths = groups.length - VISIBLE_MONTHS;
    html += `<button class="load-more-btn" id="loadMoreMonthsBtn" data-loaded="${VISIBLE_MONTHS}" data-total="${groups.length}" onclick="loadMoreMonths(this)" style="margin-top:12px;">加载更多月份（还有 ${remainingMonths} 个月）</button>`;
  }

  container.innerHTML = html;
}

// 加载更多卡片（月内）
function loadMore(btn) {
  const loaded = parseInt(btn.getAttribute('data-loaded'));
  const total = parseInt(btn.getAttribute('data-total'));
  const nextBatch = Math.min(loaded + VISIBLE_COUNT, total);

  // 显示下一批卡片
  const container = btn.closest('.month-group');
  const hiddenCards = container.querySelectorAll('.card-item.card-hidden');
  let shown = 0;
  for (let i = 0; i < hiddenCards.length && shown < VISIBLE_COUNT; i++) {
    hiddenCards[i].classList.remove('card-hidden');
    shown++;
  }

  // 更新按钮
  const remaining = total - nextBatch;
  if (remaining <= 0) {
    btn.style.display = 'none';
  } else {
    btn.setAttribute('data-loaded', nextBatch);
    btn.textContent = `加载更多（还有 ${remaining} 篇）`;
  }
}

// 统一的展开/收起切换（上方按钮始终保留）
function toggleMonth(btn, monthKey) {
  const monthGroup = btn.closest('.month-group');
  const detail = monthGroup.querySelector(`.month-detail[data-month="${monthKey}"]`);
  const label = monthGroup.querySelector('.month-label').textContent;
  const totalCount = detail.querySelectorAll('.card-item').length;
  const isExpanded = btn.classList.contains('expanded');

  if (isExpanded) {
    // 收起
    detail.classList.add('cards-hidden');
    btn.classList.remove('expanded');
    btn.classList.add('collapsed-style');
    btn.setAttribute('data-action', 'expand');
    btn.innerHTML = `📂 查看${label}全部限免（${totalCount} 篇）<span class="arrow-icon">▼</span>`;
  } else {
    // 展开
    detail.classList.remove('cards-hidden');
    btn.classList.add('expanded');
    btn.classList.remove('collapsed-style');
    btn.setAttribute('data-action', 'collapse');
    btn.innerHTML = `📂 收起${label}限免<span class="arrow-icon">▲</span>`;
  }
}

// 加载更多月份
function loadMoreMonths(btn) {
  const loaded = parseInt(btn.getAttribute('data-loaded'));
  const total = parseInt(btn.getAttribute('data-total'));
  const nextBatch = Math.min(loaded + VISIBLE_MONTHS, total);

  // 显示下一批月份
  const allMonths = document.querySelectorAll('.month-group.month-hidden');
  let shown = 0;
  for (let i = 0; i < allMonths.length && shown < VISIBLE_MONTHS; i++) {
    allMonths[i].classList.remove('month-hidden');
    shown++;
  }

  // 更新按钮
  const remaining = total - nextBatch;
  if (remaining <= 0) {
    btn.style.display = 'none';
  } else {
    btn.setAttribute('data-loaded', nextBatch);
    btn.textContent = `加载更多月份（还有 ${remaining} 个月）`;
  }
}

// 初始化
render();

    // 首页搜索功能（全局搜索 apps.json）
    (function() {
      var input = document.getElementById('searchInput');
      var resultsEl = document.getElementById('searchResults');
      if (!input || !resultsEl) return;
      var allApps = [];
      fetch('./apps.json?t=' + Date.now()).then(function(r) { return r.json(); })
        .then(function(apps) { allApps = apps; }).catch(function() {});
      function highlightMatch(text, q) {
        if (!q) return text;
        var idx = text.toLowerCase().indexOf(q.toLowerCase());
        if (idx === -1) return text;
        return text.slice(0, idx) + '<span class="result-match">' + text.slice(idx, idx + q.length) + '</span>' + text.slice(idx + q.length);
      }
      function showResults() {
        var q = input.value.trim();
        resultsEl.innerHTML = '';
        if (!q) { resultsEl.classList.remove('show'); return; }
        if (!allApps.length) return;
        var matched = allApps.filter(function(a) {
          return a.name.toLowerCase().indexOf(q.toLowerCase()) !== -1 ||
                 a.desc.toLowerCase().indexOf(q.toLowerCase()) !== -1;
        });
        if (matched.length === 0) {
          resultsEl.innerHTML = '<div class="search-no-results">未找到匹配的 App</div>';
          resultsEl.classList.add('show'); return;
        }
        matched.slice(0, 15).forEach(function(app) {
          var item = document.createElement('div');
          item.className = 'search-result-item';
          item.innerHTML = '<div class="result-name">' + highlightMatch(app.name, q) + '</div>' +
                           '<div class="result-section">' + app.section + ' · ' + app.date + '</div>';
          item.addEventListener('click', function() { window.open('./' + app.url, '_blank'); });
          resultsEl.appendChild(item);
        });
        if (matched.length > 15) {
          var more = document.createElement('div');
          more.className = 'search-no-results';
          more.textContent = '还有 ' + (matched.length - 15) + ' 个结果，按 Enter 查看全部';
          resultsEl.appendChild(more);
        }
        resultsEl.classList.add('show');
      }
      input.addEventListener('input', showResults);
      document.addEventListener('click', function(e) {
        if (!input.contains(e.target) && !resultsEl.contains(e.target)) resultsEl.classList.remove('show');
      });
      input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          var q = input.value.trim();
          if (q) window.open('./search.html?q=' + encodeURIComponent(q), '_blank');
        }
        if (e.key === 'Escape') resultsEl.classList.remove('show');
      });
    })();

</script>
